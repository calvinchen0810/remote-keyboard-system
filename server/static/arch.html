<div class="panel" id="panel-mvp">

<script>
function show(id,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  el.classList.add('active');
}

const kbmRows=[
  ['TYPE:&lt;text&gt;',    'TYPE:hello',              '輸入任意文字'],
  ['KEY:&lt;name&gt;',     'KEY:ENTER',               'ENTER ESC BACKSPACE TAB DELETE UP DOWN LEFT RIGHT HOME END PAGEUP PAGEDOWN F1–F12 等'],
  ['DOWN:&lt;mod&gt;',    'DOWN:CTRL',               '按住 CTRL SHIFT ALT GUI'],
  ['UP:&lt;mod&gt;',      'UP:CTRL',                 '放開修飾鍵'],
  ['COMBO:m+m+k',         'COMBO:CTRL+ALT+DELETE',   '組合鍵，自動 releaseAll'],
  ['RELEASEALL',           '—',                       '釋放所有按住的鍵'],
  ['MOUSE:MOVE dx dy',    'MOUSE:MOVE 50 -30',        '相對移動 −127 ~ 127'],
  ['MOUSE:CLICK L/R/M',   'MOUSE:CLICK L',            '單擊左/右/中鍵'],
  ['MOUSE:DBLCLICK L',    'MOUSE:DBLCLICK L',         '雙擊'],
  ['MOUSE:DOWN/UP L',     'MOUSE:DOWN L',             '按住/放開滑鼠鍵'],
  ['MOUSE:SCROLL n',      'MOUSE:SCROLL -3',          '滾輪，正=上 負=下'],
  ['PING',                '—',                        '連線測試，回 OK PONG'],
];
const srvRows=[
  ['ATTACH sid pin',      'ATTACH 1 9',               '掛載 Servo sid 到腳位 pin'],
  ['DETACH sid',          'DETACH 1',                 '卸載 Servo'],
  ['BEGIN n',             'BEGIN 3',                  '開始接收 n 個步驟'],
  ['STEP d s a sp h ho',  'STEP 0 1 90 60 300 1',     'delay sid angle speed hold home'],
  ['END',                 '—',                        '步驟接收完畢，開始執行'],
  ['LOOP 0/1',            'LOOP 1',                   '設定是否迴圈'],
  ['STOP',                '—',                        '立即停止並歸位'],
  ['STATUS',              '—',                        '查詢目前狀態'],
  ['PING',                '—',                        '連線測試'],
];
function buildTable(rows,tbodyId,color){
  const tb=document.getElementById(tbodyId);
  rows.forEach(([cmd,ex,desc])=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td style="color:${color};white-space:nowrap">${cmd}</td>
      <td style="color:#94a3b8;white-space:nowrap"><code>${ex}</code></td>
      <td style="color:#475569;font-size:.75rem">${desc}</td>`;
    tb.appendChild(tr);
  });
}
buildTable(kbmRows,'kbm-tb','#38bdf8');
buildTable(srvRows,'srv-tb','#f59e0b');

const mvpSteps=[
  {n:1,color:'#a78bfa',title:'Pro Micro HID 功能驗證',desc:'確認 Pro Micro Serial1 接收指令並正確輸出 HID',
   prereq:'Pro Micro 燒錄完畢插電腦1，Nano_KB 燒錄完畢插電腦2，TX/RX 線接好，GND 共地，電腦1 開啟記事本。',
   steps:['修改 <code>tools/test_promicro.py</code> 的 <code>PORT</code> 為 Nano_KB 在電腦2的 COM port',
     '執行：<code>python tools/test_promicro.py</code>',
     '預期：電腦1 記事本出現 <code>Hello RKS</code>，滑鼠移動，左鍵點擊',
     '預期：腳本印出所有測試 ✓'],
   tip:'若想先單獨測試 Pro Micro，可用電腦1 Arduino IDE Serial Monitor（38400）直接輸入 TYPE:test。'},
  {n:2,color:'#38bdf8',title:'Nano_KB 橋接功能驗證',desc:'確認 Nano_KB 能正確轉發指令到 Pro Micro 並回傳 ACK',
   prereq:'Nano_KB ↔ Pro Micro TX/RX 接好，GND 共地，電腦1 記事本開啟。',
   steps:['電腦2 Arduino IDE → Nano_KB COM port → Serial Monitor（38400，換行：Newline）',
     '輸入 <code>TYPE:bridge test</code>，預期電腦1 出現文字，Serial Monitor 收到 <code>OK</code>',
     '輸入 <code>COMBO:CTRL+A</code>，預期電腦1 全選',
     '輸入 <code>KEY:DELETE</code>，預期文字刪除',
     '輸入 <code>PING</code>，預期回 <code>OK PONG</code>'],
   tip:'Serial Monitor 換行設定要選 Newline，不是 No line ending。'},
  {n:3,color:'#f59e0b',title:'Nano_SRV Servo 功能驗證',desc:'確認 Nano_SRV 能正確控制 Servo',
   prereq:'Nano_SRV 燒錄完畢，SG90 接在 D9。',
   steps:['修改 <code>tools/test_nano_servo.py</code> 的 <code>PORT</code> 為 Nano_SRV COM port',
     '執行：<code>python tools/test_nano_servo.py</code>',
     '預期：Servo 旋轉到 90° 停留後歸位',
     '預期：腳本印出所有測試 ✓（含 OK DONE）'],tip:''},
  {n:4,color:'#22c55e',title:'FastAPI 串口連線驗證',desc:'確認 FastAPI 可連上兩個 Nano 並透過 WebSocket 推播狀態',
   prereq:'兩個 Nano 都插在電腦2，server 已啟動。',
   steps:['啟動：<code>uvicorn main:app --reload</code>',
     '瀏覽器開 <code>http://localhost:8000</code>',
     'KBM 選 Nano_KB COM port → CONNECT，確認 LED 變綠',
     'SRV 選 Nano_SRV COM port → CONNECT，確認 LED 變綠',
     '查看 SRV/KBM Serial Monitor tab，確認顯示 WS connected',
     '開 <code>/health</code>，確認 kbm.connected 和 srv.connected 都是 true'],tip:''},
  {n:5,color:'#38bdf8',title:'完整端對端驗證',desc:'確認完整鏈路從網頁到電腦1 鍵盤/Servo',
   prereq:'步驟 1–4 全部通過。',
   steps:['Text Input 輸入 <code>hello end-to-end</code> 按 Enter，確認電腦1 出現文字',
     '點 CTRL+C 快捷鍵，確認 KBM log 顯示 OK',
     '展開 keyboard overlay，點幾個鍵，確認電腦1 有輸入',
     'ATTACH S1，Single Step 送出 angle=45，確認 Servo 動作',
     'Script 加兩個 SRV step，▶ RUN，確認 Progress 2/2 DONE',
     '混合腳本：KBD + SRV step，確認按序執行',
     '確認 Webcam 面板顯示電腦1 螢幕'],tip:''},
];
const container=document.getElementById('mvp-container');
mvpSteps.forEach(ms=>{
  const div=document.createElement('div');
  div.style.cssText=`background:#0d0d10;border:1px solid #1a1a24;border-radius:4px;padding:16px;margin-bottom:14px;border-left:3px solid ${ms.color}`;
  div.innerHTML=`<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px">
    <span style="font-family:Consolas,monospace;font-size:.75rem;color:${ms.color}">Step ${ms.n}</span>
    <span style="font-family:Consolas,monospace;font-size:.85rem;color:#e2e8f0">${ms.title}</span></div>
    <div style="font-size:.78rem;color:#475569;margin-bottom:8px">${ms.desc}</div>
    ${ms.prereq?`<div style="font-size:.75rem;color:#92400e;background:#1a0e00;border:1px solid #3a2000;border-radius:3px;padding:5px 8px;margin-bottom:8px">⚠ ${ms.prereq}</div>`:''}
    <ol style="padding-left:20px;display:flex;flex-direction:column;gap:5px">
      ${ms.steps.map(s=>`<li style="font-size:.78rem;color:#94a3b8;line-height:1.6">${s}</li>`).join('')}
    </ol>
    ${ms.tip?`<div style="font-size:.73rem;color:#475569;margin-top:8px;border-top:1px solid #1a1a24;padding-top:8px">💡 ${ms.tip}</div>`:''}`;
  container.appendChild(div);
});
</script>
